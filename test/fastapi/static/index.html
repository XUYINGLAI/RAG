<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h>
        我是12345678
    </h>
    <p>
        999999999999
    </p>


    <button id="btn">点击我发请求</button>




    <script>
      // 这里就是写js代码的地方
        //点击按钮的时候发送ajax请求
        // 1获取事件源  2添加事件监听（事件类型） 3回调函数(浏览器内核在调用) 事件发生要干啥
        const btn = document.getElementById("btn")

        btn.onclick = async function (){
            const res = await fetch("http://localhost:8000/hello")
            const data = await res.json()
            console.log(data)
        }

    </script>

</body>
</html>
