<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <h1>SSE案例02</h1>


    请输入你要问的问题:<input type="text" id="query" value="XYL?"/>
    <br>
    请输入你的会话id:<input type="text" id="sessionid" placeholder="你的id还记得吗"/>
    <br>
    <button id = "btn">发送请求给后端</button>


    <div id="content" ></div>

    <script>
        const btn=document.getElementById('btn')
        const query=document.getElementById('query').value
        const session_id=document.getElementById("sessionid").value
        // console.log(query)

        btn.onclick=async function() {
            const res = await fetch("http://localhost:8000/sse02", {
                method: "POST",
                headers: {
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(
                    {
                        "query":query,
                        "session_id":session_id
                    }
                )
            })

            const data = await res.json()
            console.log(data)

            const es=new EventSource("http://localhost:8000/handlersse02?session_id="+session_id)
            es.onmessage=function (e){
                console.log(e.data)

                document.getElementById('content').innerHTML+=e.data+'<br/>'
            }





        }

    </script>

</body>
</html>
